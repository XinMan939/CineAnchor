services:
  app:
    build: .
    container_name: cineanchor-app
    restart: unless-stopped
    volumes:
      # 真实配置 (tmdb_token + providers), 不进镜像
      - ./config.json:/app/config.json:ro
      # SQLite 数据持久化到宿主机 (缓存 + 内容库)
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    # 健康检查: 容器内自检 (不走 nginx)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: cineanchor-nginx
    restart: unless-stopped
    ports:
      - "80:80"          # 上 SSL 证书时改 443:443 并启用 conf 里的 https 段
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 上证书时解开 (路径按实际证书位置调整):
      # - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
