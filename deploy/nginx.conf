# CineAnchor 反向代理
# 职责: 80/443 入口 -> app:8787, 顺带加基础安全头与 gzip
# 上 SSL: 用 certbot 免费证书, 解开下面 443 段并 docker compose restart nginx

server {
    listen 80;
    server_name _;

    # ---- 证书就绪后解开这一段, 并把 80 改成 301 跳 https ----
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 上传/请求体
    client_max_body_size 10m;

    # gzip: 前端与 JSON
    gzip on;
    gzip_types text/html application/json application/javascript text/css;
    gzip_min_length 1024;

    # 真实 IP 透传
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 注意: 不剥离 Referer —— 部分采集站 m3u8 有 Referer 校验,
    # 浏览器直连 CDN 播放, 过代理时需保留原始头.

    location / {
        proxy_pass http://app:8787;
        proxy_connect_timeout 5s;
        # 线路聚合接口内部 8s 超时切断, 这里放宽到 15s 兜底
        proxy_read_timeout 15s;
    }

    # 手动触发索引: 收紧一点, 只信任本机 (cron 从宿主机 curl)
    # 若需要公网按钮触发, 自行放开或加 basic auth
    location = /api/v1/indexer/run {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # docker 内网 (前端按钮走的路径)
        deny all;
        proxy_pass http://app:8787;
    }
}
