<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineAnchor · 影锚</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
         background: #0d1117; color: #e6edf3; }
  header { padding: 20px 28px; display: flex; gap: 18px; align-items: center;
           border-bottom: 1px solid #21262d; }
  header h1 { font-size: 20px; }
  header .tag { font-size: 12px; color: #7d8590; }
  #searchbox { flex: 1; max-width: 420px; padding: 9px 14px; border-radius: 8px;
               border: 1px solid #30363d; background: #161b22; color: #e6edf3; outline: none; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 65px); }
  #player-pane { padding: 24px; }
  #player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; }
  #lines { padding: 24px 24px 24px 0; overflow-y: auto; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
          padding: 16px; margin-bottom: 14px; }
  .card h3 { font-size: 15px; margin-bottom: 6px; }
  .card .meta { font-size: 12px; color: #7d8590; }
  .line-item { display: flex; justify-content: space-between; align-items: center;
               padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .line-item:hover { background: #1f2630; }
  .line-item.active { background: #1f6feb33; border: 1px solid #1f6feb; }
  .line-item .src { color: #7d8590; font-size: 12px; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
             gap: 14px; padding: 24px; }
  .poster { cursor: pointer; }
  .poster img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
  .poster .t { font-size: 13px; margin-top: 6px; overflow: hidden;
               white-space: nowrap; text-overflow: ellipsis; }
  .poster .y { font-size: 11px; color: #7d8590; }
  .poster .r { font-size: 11px; color: #e3b341; }
  #hint { padding: 60px; text-align: center; color: #7d8590; font-size: 14px; }
  section.block { padding: 20px 24px 0; }
  section.block h2 { font-size: 15px; color: #7d8590; margin-bottom: 12px; }
  section.block .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
  select.season { background: #161b22; color: #e6edf3; border: 1px solid #30363d;
                   border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  button.reload { background:none; border:1px solid #30363d; color:#7d8590; font-size:12px;
                  padding:4px 10px; border-radius:6px; cursor:pointer; margin-left:10px; }
  /* 详情页: 背景大图 + 元信息 */
  .detail-hero { position: relative; border-radius: 12px; overflow: hidden;
                 margin-bottom: 14px; border: 1px solid #30363d; }
  .detail-hero .backdrop { width: 100%; aspect-ratio: 16/7; object-fit: cover; display: block; }
  .detail-hero .veil { position: absolute; inset: 0;
                        background: linear-gradient(180deg, #0d111700 0%, #0d1117e6 78%, #0d1117 100%); }
  .detail-hero .info { position: absolute; left: 16px; right: 16px; bottom: 12px;
                       display: flex; gap: 14px; align-items: flex-end; }
  .detail-hero .info img { width: 92px; aspect-ratio: 2/3; object-fit: cover;
                           border-radius: 8px; border: 1px solid #30363d88; flex: none; }
  .detail-hero .info .txt { min-width: 0; }
  .detail-hero .info h3 { font-size: 18px; margin-bottom: 4px; }
  .detail-hero .info .meta { font-size: 12px; color: #9ea7b3; }
  .overview { font-size: 13px; line-height: 1.7; color: #c9d1d9; }
  .ep-list { max-height: 420px; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>⚓ CineAnchor <span class="tag">以作品为锚 · 聚合线路</span></h1>
  <input id="searchbox" placeholder="搜索作品名，回车…">
</header>

<div id="hint" style="display:none"></div>
<div id="results" style="display:none"></div>

<section class="block" id="latest-wrap">
  <h2>🆕 最新上线 <span style="font-size:11px">采集站更新 · 已过 TMDB 识别</span>
    <button class="reload" onclick="runIndexer()">抓取一轮</button></h2>
  <div class="grid" id="latest"></div>
</section>

<section class="block" id="trending-wrap">
  <h2>🔥 热门榜单</h2>
  <div class="grid" id="trending"></div>
</section>

<main id="main" style="display:none">
  <div id="player-pane">
    <video id="player" controls playsinline></video>
  </div>
  <div id="lines"></div>
</main>

<script>
const API = location.origin.startsWith('http') && !location.port || location.port === '8787'
  ? `${location.protocol}//${location.hostname}:8787` : '';
const $ = s => document.querySelector(s);

let HlsPlayer = null;

// 首页: 内容库最新上线 + TMDB 热门榜
async function loadLatest() {
  try {
    const r = await fetch(`${API}/api/v1/latest?n=24`);
    if (!r.ok) { $('#latest-wrap').style.display = 'none'; return; }
    const d = await r.json();
    const box = $('#latest');
    d.items.forEach(i => {
      const el = document.createElement('div');
      el.className = 'poster';
      el.innerHTML = `<img src="${i.poster || ''}" loading="lazy">
                      <div class="t">${i.title}</div>
                      <div class="y">${i.updated_at}${i.season ? ' S' + i.season : ''}</div>`;
      el.onclick = () => openMedia(i.type, i.tmdb_id, i.title, i.season || 0);
      box.appendChild(el);
    });
  } catch (e) { console.warn('latest failed', e); }
}

async function loadTrending() {
  try {
    const r = await fetch(`${API}/api/v1/trending`);
    const d = await r.json();
    const box = $('#trending');
    d.items.slice(0, 18).forEach(i => {
      const el = document.createElement('div');
      el.className = 'poster';
      el.innerHTML = `<img src="${i.poster || ''}" loading="lazy">
                      <div class="t">${i.title}</div>
                      <div class="y">${i.year || ''} <span class="r">★${i.rating || ''}</span></div>`;
      el.onclick = () => openMedia(i.type, i.tmdb_id, i.title);
      box.appendChild(el);
    });
  } catch (e) { console.warn('trending failed', e); }
}

async function runIndexer() {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '抓取中…';
  try {
    const r = await fetch(`${API}/api/v1/indexer/run`, { method: 'POST' });
    const d = await r.json();
    $('#latest').innerHTML = '';
    await loadLatest();
  } catch (e) { alert('抓取失败: ' + e); }
  finally { btn.disabled = false; btn.textContent = '抓取一轮'; }
}

loadLatest();
loadTrending();

async function search() {
  const q = $('#searchbox').value.trim();
  if (!q) return;
  $('#hint').textContent = '搜索中…';
  $('#hint').style.display = 'block';
  $('#results').style.display = 'none';
  $('#main').style.display = 'none';
  const r = await fetch(`${API}/api/v1/search?q=${encodeURIComponent(q)}`);
  const d = await r.json();
  if (!d.count) { $('#hint').textContent = 'TMDB 未找到该作品'; return; }
  $('#hint').style.display = 'none';
  const box = $('#results');
  box.innerHTML = '';
  box.style.display = 'grid';
  d.items.forEach(i => {
    const el = document.createElement('div');
    el.className = 'poster';
    el.innerHTML = `<img src="${i.poster || ''}" loading="lazy">
                   <div class="t">${i.title}</div><div class="y">${i.year || ''}</div>`;
    el.onclick = () => openMedia(i.type, i.tmdb_id, i.title);
    box.appendChild(el);
  });
}

async function openMedia(type, id, title, season) {
  $('#trending-wrap').style.display = 'none';
  $('#latest-wrap').style.display = 'none';
  $('#results').style.display = 'none';
  $('#main').style.display = 'grid';
  $('#lines').innerHTML = '<div class="card"><h3>线路聚合中…</h3><div class="meta">并发请求采集站</div></div>';
  season = season || 0;
  const r = await fetch(`${API}/api/v1/sources/${type}/${id}?season=${season}`);
  const d = await r.json();
  renderLines(d);
}

function renderLines(d) {
  document.title = `${d.media.title} · CineAnchor`;
  const box = $('#lines');
  const seasonSel = d.media.type === 'tv' && d.media.seasons > 1
    ? `<select class="season" onchange="openMedia('${d.media.type}', ${d.media.tmdb_id}, '${d.media.title}', +this.value)">
         ${Array.from({length: d.media.seasons}, (_, i) =>
           `<option value="${i+1}" ${d.media.season === i+1 ? 'selected' : ''}>第 ${i+1} 季</option>`).join('')}
       </select>` : '';
  const backdrop = d.media.backdrop
    ? `https://image.tmdb.org/t/p/w780${d.media.backdrop}` : '';
  const poster = d.media.poster_full || '';
  const hero = `
    <div class="detail-hero">
      ${backdrop ? `<img class="backdrop" src="${backdrop}" onerror="this.remove()">` : ''}
      <div class="veil"></div>
      <div class="info">
        ${poster ? `<img src="${poster}">` : ''}
        <div class="txt">
          <h3>${d.media.title} (${d.media.year})</h3>
          <div class="meta">${d.media.type === 'tv' ? '剧集' : '电影'} · ${d.lines.length} 条线路 ${seasonSel}</div>
        </div>
      </div>
    </div>
    <div class="card"><div class="overview">${d.media.overview || '暂无简介'}</div></div>`;
  box.innerHTML = hero + '<div class="card"><h3>播放线路 <span class="meta">点击切换</span></h3><div class="ep-list"></div></div>';
  const epBox = box.querySelector('.ep-list');
  if (!d.lines.length) {
    epBox.innerHTML = '<div class="meta" style="padding:8px 0">暂无可用线路</div>';
    return;
  }
  d.lines.forEach((l, idx) => {
    const el = document.createElement('div');
    el.className = 'line-item' + (idx === 0 ? ' active' : '');
    el.innerHTML = `<span>${l.episode}</span><span class="src">${l.provider} · score${l.score}</span>`;
    el.onclick = () => {
      document.querySelectorAll('.line-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      play(l.url);
    };
    epBox.appendChild(el);
  });
  play(d.lines[0].url);  // 默认播第一条
}

function refresh() {}

function play(url) {
  const v = $('#player');
  if (HlsPlayer) { HlsPlayer.destroy(); HlsPlayer = null; }
  if (window.Hls && Hls.isSupported()) {
    HlsPlayer = new Hls();
    HlsPlayer.loadSource(url);
    HlsPlayer.attachMedia(v);
    HlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => v.play());
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = url; v.play();
  }
}

$('#searchbox').addEventListener('keydown', e => e.key === 'Enter' && search());
</script>
</body>
</html>
